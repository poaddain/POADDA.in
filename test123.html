<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  font-family:'Segoe UI',sans-serif;
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#f9d423,#ff4e50);
  display:flex;
  flex-direction:column;
  align-items:center;
}

.logo{
  width:120px;
  margin-top:30px;
}

h1{
  color:#fff;
  margin:10px 0 25px;
}

.glass{
  width:90%;
  max-width:450px;
  background:rgba(255,255,255,.88);
  border-radius:20px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.welcome{
  font-size:1.2rem;
  margin-bottom:18px;
  font-weight:600;
}

.cards{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.card{
  padding:16px;
  border-radius:14px;
  background:rgba(0,0,0,.08);
  cursor:pointer;
  font-weight:600;
  transition:.25s;
}

.card:hover{
  background:#00c6ff;
  color:#000;
  transform:translateY(-3px);
}
</style>
</head>

<body>

<img src="logo.png" class="logo">
<h1>Dashboard</h1>

<!-- Glass Container : C–F -->
<div class="glass">
  <div class="welcome">
    Welcome, <span id="studentName">Student</span>
  </div>
  <div class="cards" id="cardsCF"></div>
</div>

<!-- Glass Container : I–K -->
<div class="glass" id="glassIK" style="display:none">
  <div class="cards" id="cardsIK"></div>
</div>

<script>
const SHEET_URL =
"https://script.google.com/macros/s/AKfycbyo-QfW63UR5-nWaB_CQsIQGqNr7gP4GTOe3RMpx0lLjdaYoQB9fbFAiQwpjX4-sf2B0w/exec";

const mobile = localStorage.getItem("mobile");

if(!mobile){
  alert("Session expired. Please login again.");
  window.location.href="login.html";
}

fetch(SHEET_URL)
.then(res => res.json())
.then(rows => {

  // Find row where Column A = mobile
  const row = rows.find(r => String(r.A).trim() === String(mobile).trim());

  if(!row){
    alert("Student record not found");
    return;
  }

  // Column B → Name
  document.getElementById("studentName").innerText = row.B || "Student";

  const cardsCF = document.getElementById("cardsCF");
  const cardsIK = document.getElementById("cardsIK");
  const glassIK = document.getElementById("glassIK");

  // Columns C–F
  ["C","D","E","F"].forEach(col => {
    if(row[col]){
      const div = document.createElement("div");
      div.className = "card";
      div.innerText = row[col];
      cardsCF.appendChild(div);
    }
  });

  // Columns I–K
  let hasIK = false;
  ["I","J","K"].forEach(col => {
    if(row[col]){
      hasIK = true;
      const div = document.createElement("div");
      div.className = "card";
      div.innerText = row[col];
      cardsIK.appendChild(div);
    }
  });

  if(hasIK){
    glassIK.style.display = "block";
  }

})
.catch(err => {
  console.error(err);
  alert("Failed to load data from server");
});
</script>

</body>
</html>
